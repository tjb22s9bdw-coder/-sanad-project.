
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملفي الشخصي | سَنَد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navber">
        <a href="dashboard.html" class="logo">سَنَد<span>.</span></a>
        <nav>
            <a href="dashboard.html">العودة إلى مشاريعي</a>
        </nav>
    </header>

    <main class="section">
        <div class="dashboard-welcome">
            <span class="eyebrow">مساحتك الخاصة</span>
            <h1>ملفي الشخصي</h1>
            <p>أهلاً بك في حسابك على سَنَد.</p>
        </div>

        <section class="project-card">
            <h2>بياناتي</h2>

            <form id="profile-form">
                <label for="full-name">الاسم</label>
                <input type="text" id="full-name"
                    placeholder="اكتب اسمك" required>

                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email"
                    placeholder="example@email.com">

                <label for="phone">رقم الجوال</label>
                <input type="tel" id="phone"
                    placeholder="05xxxxxxxx">

                <button type="submit" class="primary-button">
                    حفظ بياناتي
                </button>
            </form>

            <p id="profile-message" style="margin-top:15px;"></p>
        </section>
    </main>

    <script src="profile.js"></script>
</body>
</html>
